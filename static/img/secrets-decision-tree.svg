<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#424242"/>
    </marker>
    <linearGradient id="questionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>
    <linearGradient id="yesGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
    <linearGradient id="noGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">Secrets Management Decision Tree</text>

  <!-- Q1: Does your app need secrets from Azure? -->
  <rect x="220" y="45" width="280" height="44" rx="22" fill="url(#questionGrad)" stroke="#1565C0" stroke-width="1.5"/>
  <text x="360" y="72" text-anchor="middle" font-weight="600" fill="#0D47A1">Does your app need secrets from Azure?</text>

  <!-- YES branch from Q1 -->
  <line x1="310" y1="89" x2="310" y2="130" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="295" y="115" font-size="12" font-weight="bold" fill="#2E7D32">YES</text>

  <!-- NO branch from Q1 -->
  <line x1="500" y1="89" x2="590" y2="130" stroke="#E65100" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="555" y="115" font-size="12" font-weight="bold" fill="#E65100">NO</text>

  <!-- Q2: Does it read from filesystem? -->
  <rect x="160" y="135" width="280" height="44" rx="22" fill="url(#questionGrad)" stroke="#1565C0" stroke-width="1.5"/>
  <text x="300" y="162" text-anchor="middle" font-weight="600" fill="#0D47A1">Does it read from filesystem?</text>

  <!-- Answer: No secrets needed -->
  <rect x="490" y="135" width="210" height="44" rx="8" fill="url(#noGrad)" stroke="#E65100" stroke-width="1.5"/>
  <text x="595" y="154" text-anchor="middle" font-size="12" fill="#BF360C">You probably still have secrets.</text>
  <text x="595" y="170" text-anchor="middle" font-weight="bold" font-size="12" fill="#BF360C">Use Key Vault anyway.</text>

  <!-- YES branch from Q2 -->
  <line x1="240" y1="179" x2="170" y2="225" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="185" y="207" font-size="12" font-weight="bold" fill="#2E7D32">YES</text>

  <!-- NO branch from Q2 -->
  <line x1="370" y1="179" x2="420" y2="225" stroke="#E65100" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="405" y="207" font-size="12" font-weight="bold" fill="#E65100">NO</text>

  <!-- Answer: Use Secrets Store CSI Driver -->
  <rect x="60" y="230" width="230" height="50" rx="8" fill="url(#yesGrad)" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="175" y="253" text-anchor="middle" font-weight="bold" fill="#1B5E20">Use Secrets Store</text>
  <text x="175" y="270" text-anchor="middle" font-weight="bold" fill="#1B5E20">CSI Driver</text>

  <!-- Q3: Can you change it? -->
  <rect x="320" y="230" width="220" height="44" rx="22" fill="url(#questionGrad)" stroke="#1565C0" stroke-width="1.5"/>
  <text x="430" y="257" text-anchor="middle" font-weight="600" fill="#0D47A1">Can you change it?</text>

  <!-- YES branch from Q3 -->
  <line x1="380" y1="274" x2="310" y2="325" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="325" y="305" font-size="12" font-weight="bold" fill="#2E7D32">YES</text>

  <!-- NO branch from Q3 -->
  <line x1="480" y1="274" x2="530" y2="325" stroke="#E65100" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="305" font-size="12" font-weight="bold" fill="#E65100">NO</text>

  <!-- Answer: Change it, use CSI Driver -->
  <rect x="195" y="330" width="230" height="50" rx="8" fill="url(#yesGrad)" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="310" y="353" text-anchor="middle" font-weight="bold" fill="#1B5E20">Change it, use</text>
  <text x="310" y="370" text-anchor="middle" font-weight="bold" fill="#1B5E20">CSI Driver</text>

  <!-- Answer: Use External Secrets Operator -->
  <rect x="450" y="330" width="230" height="50" rx="8" fill="url(#noGrad)" stroke="#E65100" stroke-width="1.5"/>
  <text x="565" y="353" text-anchor="middle" font-weight="bold" fill="#BF360C">Use External Secrets</text>
  <text x="565" y="370" text-anchor="middle" font-weight="bold" fill="#BF360C">Operator</text>

  <!-- Legend -->
  <rect x="20" y="395" width="12" height="12" rx="2" fill="#C8E6C9" stroke="#2E7D32"/>
  <text x="37" y="406" font-size="11" fill="#424242">Recommended path</text>
  <rect x="160" y="395" width="12" height="12" rx="2" fill="#FFE0B2" stroke="#E65100"/>
  <text x="177" y="406" font-size="11" fill="#424242">Alternative / fallback</text>
  <rect x="310" y="395" width="12" height="12" rx="2" fill="#BBDEFB" stroke="#1565C0"/>
  <text x="327" y="406" font-size="11" fill="#424242">Decision point</text>
</svg>
