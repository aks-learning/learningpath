<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 340" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0078D4"/>
    </marker>
    <marker id="arrowLoop" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2E7D32"/>
    </marker>
  </defs>

  <text x="200" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">Flux Reconciliation Loop</text>

  <!-- Git Repo -->
  <rect x="100" y="40" width="200" height="48" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="200" y="60" text-anchor="middle" font-weight="bold" fill="#4A148C">Git Repo</text>
  <text x="200" y="76" text-anchor="middle" font-size="11" fill="#6A1B9A">Source of truth</text>

  <line x1="200" y1="88" x2="200" y2="115" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="218" y="106" font-size="10" fill="#616161">polls</text>

  <!-- GitRepository -->
  <rect x="100" y="120" width="200" height="48" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="200" y="140" text-anchor="middle" font-weight="bold" fill="#0D47A1">GitRepository</text>
  <text x="200" y="156" text-anchor="middle" font-size="11" fill="#1565C0">Flux watches for changes</text>

  <line x1="200" y1="168" x2="200" y2="195" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="218" y="186" font-size="10" fill="#616161">triggers</text>

  <!-- Kustomization -->
  <rect x="100" y="200" width="200" height="48" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="200" y="220" text-anchor="middle" font-weight="bold" fill="#0D47A1">Kustomization</text>
  <text x="200" y="236" text-anchor="middle" font-size="11" fill="#1565C0">Applies manifests from path</text>

  <line x1="200" y1="248" x2="200" y2="275" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="218" y="266" font-size="10" fill="#616161">applies</text>

  <!-- Cluster State -->
  <rect x="100" y="280" width="200" height="48" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="200" y="300" text-anchor="middle" font-weight="bold" fill="#1B5E20">Cluster State</text>
  <text x="200" y="316" text-anchor="middle" font-size="11" fill="#2E7D32">Continuously reconciled</text>

  <!-- Reconciliation loop arrow -->
  <path d="M 310 300 C 380 300, 380 60, 310 60" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowLoop)"/>
  <text x="395" y="180" text-anchor="middle" font-size="10" fill="#2E7D32" transform="rotate(90, 395, 180)">reconcile loop</text>
</svg>
