<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Segoe UI, Arial, sans-serif">
  <!-- Azure managed zone -->
  <rect x="20" y="20" width="560" height="160" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="300" y="48" text-anchor="middle" font-weight="bold" font-size="14" fill="#1a3a5c">Azure (Microsoft-managed)</text>

  <!-- Control Plane box -->
  <rect x="50" y="60" width="500" height="100" rx="8" fill="#f8f9fa" stroke="#888" stroke-width="1.5"/>
  <text x="300" y="82" text-anchor="middle" font-weight="bold" font-size="12" fill="#333">Control Plane</text>

  <!-- Control Plane components -->
  <rect x="70" y="95" width="100" height="45" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="120" y="122" text-anchor="middle" font-size="11" fill="#333">API Server</text>

  <!-- etcd cylinder-like shape -->
  <rect x="190" y="95" width="90" height="45" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <ellipse cx="235" cy="98" rx="45" ry="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="235" y="125" text-anchor="middle" font-size="11" fill="#333">etcd</text>

  <rect x="300" y="95" width="100" height="45" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="350" y="122" text-anchor="middle" font-size="11" fill="#333">Scheduler</text>

  <rect x="420" y="95" width="110" height="45" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="475" y="116" text-anchor="middle" font-size="11" fill="#333">Controller</text>
  <text x="475" y="131" text-anchor="middle" font-size="11" fill="#333">Manager</text>

  <!-- Dashed connection lines -->
  <line x1="180" y1="180" x2="180" y2="230" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="300" y1="180" x2="300" y2="230" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="420" y1="180" x2="420" y2="230" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Your Subscription zone -->
  <rect x="20" y="220" width="560" height="160" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="300" y="248" text-anchor="middle" font-weight="bold" font-size="14" fill="#2d5a1b">Your Subscription</text>

  <!-- Node Pools -->
  <rect x="50" y="260" width="150" height="100" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="125" y="285" text-anchor="middle" font-weight="bold" font-size="12" fill="#4a2d6b">System Pool</text>
  <text x="125" y="305" text-anchor="middle" font-size="10" fill="#555">CoreDNS, metrics</text>
  <text x="125" y="320" text-anchor="middle" font-size="10" fill="#555">kube-proxy</text>
  <rect x="75" y="330" width="30" height="18" rx="4" fill="#b8a3cc" stroke="none"/>
  <rect x="110" y="330" width="30" height="18" rx="4" fill="#b8a3cc" stroke="none"/>
  <text x="90" y="343" text-anchor="middle" font-size="8" fill="#fff">pod</text>
  <text x="125" y="343" text-anchor="middle" font-size="8" fill="#fff">pod</text>

  <rect x="225" y="260" width="150" height="100" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="300" y="285" text-anchor="middle" font-weight="bold" font-size="12" fill="#4a2d6b">User Pool</text>
  <text x="300" y="305" text-anchor="middle" font-size="10" fill="#555">Your app pods</text>
  <text x="300" y="320" text-anchor="middle" font-size="10" fill="#555">Services</text>
  <rect x="250" y="330" width="30" height="18" rx="4" fill="#b8a3cc" stroke="none"/>
  <rect x="285" y="330" width="30" height="18" rx="4" fill="#b8a3cc" stroke="none"/>
  <rect x="320" y="330" width="30" height="18" rx="4" fill="#b8a3cc" stroke="none"/>
  <text x="265" y="343" text-anchor="middle" font-size="8" fill="#fff">pod</text>
  <text x="300" y="343" text-anchor="middle" font-size="8" fill="#fff">pod</text>
  <text x="335" y="343" text-anchor="middle" font-size="8" fill="#fff">pod</text>

  <rect x="400" y="260" width="150" height="100" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="475" y="285" text-anchor="middle" font-weight="bold" font-size="12" fill="#4a2d6b">GPU Pool</text>
  <text x="475" y="305" text-anchor="middle" font-size="10" fill="#555">AI/ML workloads</text>
  <text x="475" y="320" text-anchor="middle" font-size="10" fill="#555">Inference</text>
  <rect x="440" y="330" width="30" height="18" rx="4" fill="#b8a3cc" stroke="none"/>
  <rect x="475" y="330" width="30" height="18" rx="4" fill="#b8a3cc" stroke="none"/>
  <text x="455" y="343" text-anchor="middle" font-size="8" fill="#fff">pod</text>
  <text x="490" y="343" text-anchor="middle" font-size="8" fill="#fff">pod</text>
</svg>
