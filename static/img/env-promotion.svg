<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#424242"/>
    </marker>
  </defs>

  <text x="310" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">Environment Promotion</text>

  <!-- Dev -->
  <rect x="40" y="45" width="140" height="55" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="110" y="70" text-anchor="middle" font-weight="bold" font-size="14" fill="#1B5E20">dev</text>
  <text x="110" y="88" text-anchor="middle" font-size="11" fill="#2E7D32">auto-deploy on merge</text>

  <!-- Arrow dev->staging -->
  <line x1="180" y1="72" x2="220" y2="72" stroke="#424242" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Staging -->
  <rect x="225" y="45" width="140" height="55" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="295" y="70" text-anchor="middle" font-weight="bold" font-size="14" fill="#E65100">staging</text>
  <text x="295" y="88" text-anchor="middle" font-size="11" fill="#BF360C">auto-deploy on merge</text>

  <!-- Arrow staging->production -->
  <line x1="365" y1="72" x2="405" y2="72" stroke="#424242" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Production -->
  <rect x="410" y="45" width="170" height="55" rx="8" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
  <text x="495" y="70" text-anchor="middle" font-weight="bold" font-size="14" fill="#C62828">production</text>
  <text x="495" y="88" text-anchor="middle" font-size="11" fill="#C62828">PR approval required</text>

  <!-- Gate icon -->
  <rect x="388" y="58" width="18" height="28" rx="3" fill="#FFF" stroke="#C62828" stroke-width="1.5"/>
  <text x="397" y="76" text-anchor="middle" font-size="10" fill="#C62828">PR</text>

  <!-- Footer note -->
  <text x="310" y="125" text-anchor="middle" font-size="10" fill="#757575">Never auto-deploy to production. Use Git branches or directories per environment.</text>
</svg>
